name: 自动打包静态文件

on:
  push:
    branches: [ main ]  # 推送到 main 分支时触发
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # 你的项目 Node 版本
          cache: 'npm'

      - name: 安装依赖
        run: npm install

      - name: 打包生产版本
        run: npm run build  # 你的项目打包命令（Vite/React/Vue 一般是 build）

      - name: 上传 dist 产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-files  # 产物名称（后面宝塔拉取用）
          path: dist/       # 打包后的 dist 文件夹
