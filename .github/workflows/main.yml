name: 自动打包静态文件
on: [push] # 每次推代码自动执行
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 } # 配置Node.js版本
      - run: npm install && npm run build # 安装依赖+打包
      - uses: actions/upload-artifact@v4
        with: { name: dist-files, path: dist/ } # 上传dist包到GitHub
